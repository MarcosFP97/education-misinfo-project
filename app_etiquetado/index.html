<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Etiquetado de Screenshots</title>
  <script src="https://unpkg.com/lab.js@20.2.4/dist/lab.js"></script>
  <style>
    .image-container {
      width: 100%;
      height: 80vh;
      overflow: auto; /* Scroll vertical y horizontal si es necesario */
      border: 1px solid #ccc;
      text-align: center;
      margin-bottom: 20px;
    }

    .image-container img {
      max-width: 100%;
      transition: transform 0.2s;
      cursor: grab;
    }

    .labels {
      display: flex;
      gap: 20px;
      justify-content: flex-start;
      margin-bottom: 20px;
    }

    .labels label {
      display: block;
      margin-bottom: 5px;
    }
  </style>
</head>
<body>
<script>
window.onload = function() {
  const images = [
  "images/edad_x_3.png",
  "images/chatgpt_2.png",
  "images/https___www_pandasecurity_com_es_mediacenter_jurado_declara_meta_youtube_responsables_adiccion_.png",
  "images/https___larevista_com_mx_deben_prohibirse_las_redes_sociales_a_menores_expertos_advierten_sobre_adiccion_algoritmos_y_riesgos_para_la_salud_mental_.png",
  "images/claude_1.png",
  "images/https___www_plazanueva_com_articulo_navarra_estamos_entregando_movil_demasiado_pronto_nuestros_adolescentes_20260404091449280632_html.png",
  "images/gemini_3.png",
  "images/riesgos_x_5.png",
  "images/https___www_elnacional_com_2026_04_ninos_y_adolescentes_digitales_.png",
  "images/edad_x_5.png",
  "images/https___controlpublicidad_com_formacion_y_estudios_de_publicidad_algoritmos_y_su_repercusion_en_la_salud_mental_de_los_adolescentes_.png",
  "images/claude_3.png",
  "images/https___www_tn8_ni_tecnologia_todo_sobre_el_nuevo_filtro_de_instagram_que_protege_a_adolescentes_en_europa_.png",
  "images/chatgpt_1.png",
  "images/https___bitlifemedia_com_2026_04_espana_aprobara_en_mayo_una_ley_que_fija_en_16_anos_el_consentimiento_digital_.png",
  "images/derechos_x_4.png",
  "images/https___rtsmedios_com_ar_alertan_sobre_los_riesgos_del_uso_de_redes_sociales_en_ninos_y_adolescentes_.png",
  "images/edad_x_1.png",
  "images/https___noticias_udec_cl_desafio_viral_de_ingerir_imanes_gastroenterologa_udec_advierte_riesgos_y_refuerza_llamado_al_cuidado_familiar_.png",
  "images/riesgos_x_2.png",
  "images/https___www_expreso_ec_internacional_grecia_prohibira_redes_sociales_menores_15_anos_medidas_alcances_2027_278073_html.png",
  "images/claude_2.png",
  "images/derechos_x_2.png",
  "images/edad_x_4.png",
  "images/https___www_losandes_com_ar_sociedad_esi_y_riesgos_digitales_el_plan_oficial_fortalecer_estrategias_las_escuelas_mendoza_n5987124.png",
  "images/gemini_1.png",
  "images/prueba.png",
  "images/https___lt3_com_ar_772830_2_.png",
  "images/derechos_x_3.png",
  "images/chatgpt_3.png",
  "images/riesgos_x_4.png",
  "images/gemini_2.png",
  "images/derechos_x_1.png",
  "images/https___revistaraya_com_facebook_adiccion_y_dopamina_por_que_un_jurado_condeno_el_diseno_de_las_redes_sociales_html.png",
  "images/riesgos_x_3.png",
  "images/https___www_eldia_es_canarias_2026_04_09_conductas_suicidas_menores_aumentan_25_violencia_tecnologia_128929660_amp_html.png",
  "images/https___vilasradio_cl_clinica_u_de_los_andes_alerta_por_peligroso_reto_viral_ingestion_de_imanes_deja_menores_con_graves_lesiones_en_chile_.png",
  "images/edad_x_2.png",
  "images/https___agn_gt_pgn_impulsa_campana_no_caigas_en_las_redes_sobre_riesgos_digitales_para_la_ninez_y_adolescencia_.png",
  "images/riesgos_x_1.png",
  "images/derechos_x_5.png",
  "images/https___kchcomunicacion_com_2026_04_09_comision_impulsa_reformas_para_proteger_a_ninas_ninos_y_adolescentes_frente_a_riesgos_de_plataformas_digitales_.png",
  "images/https___www_politicargentina_com_notas_202604_72684_el_senado_frances_avanza_con_un_proyecto_para_prohibir_redes_sociales_a_menores_de_15_anos_html.png"
];

  const study = new lab.flow.Sequence({
    content: images.map((imgPath, idx) =>
      new lab.html.Screen({
        el: document.body,

        parameters: {
          image: imgPath
        },

        content: `
          <h3>Imagen ${idx + 1} de ${images.length}</h3>
          <div class="image-container">
            <img src="${imgPath}" id="imgZoom">
          </div>

          <div class="labels">
            <div>
              <label>Credibilidad (1-5):</label>
              <select name="credibility" required>
                <option value="" disabled selected>Selecciona...</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
              </select>
            </div>
            <div>
              <label>Calidad (1-5):</label>
              <select name="quality" required>
                <option value="" disabled selected>Selecciona...</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
              </select>
            </div>
            <div>
              <label>Correctitud (1-5):</label>
              <select name="correctness" required>
                <option value="" disabled selected>Selecciona...</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
              </select>
            </div>
          </div>

          <button id="nextBtn">Siguiente</button>
        `,

        responses: {
          type: "html",
          recorded: ["credibility", "quality", "correctness", "image"],
          submit: true
        },

        events: {
          "click #nextBtn": function() {
            const cred = this.options.el.querySelector("select[name='credibility']").value;
            const qual = this.options.el.querySelector("select[name='quality']").value;
            const corr = this.options.el.querySelector("select[name='correctness']").value;

            if (!cred || !qual || !corr) {
              alert("Selecciona una opción en todas las dimensiones antes de continuar.");
              return;
            }

            this.respond({
              credibility: cred,
              quality: qual,
              correctness: corr
            });
          },

          // Zoom con la rueda del ratón
          "wheel #imgZoom": function(e) {
            e.preventDefault();
            const img = e.target;
            const currentScale = img.dataset.scale ? parseFloat(img.dataset.scale) : 1;
            let delta = e.deltaY < 0 ? 0.1 : -0.1;
            let newScale = Math.min(Math.max(currentScale + delta, 0.5), 3); // zoom entre 0.5x y 3x
            img.style.transform = `scale(${newScale})`;
            img.dataset.scale = newScale;
          }
        }
      })
    )
  });

  study.on("end", () => {
    const csv = study.options.datastore.exportCsv();
    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "resultados.csv";
    a.click();
  });

  study.run();
};
</script>
</body>
</html>
